name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      qemu_modes:
        description: "Comma-separated QEMU modes or 'all'"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y gcc nasm xorriso mtools dos2unix zip qemu-system-x86 ovmf dosfstools exfatprogs

    - name: Ensure Unix line endings and script permissions
      run: |
        dos2unix Makefile boot/limine.conf scripts/*.sh || sed -i 's/\r$//' Makefile boot/limine.conf scripts/*.sh
        chmod +x scripts/*.sh

    - name: Build Kernel and Hybrid ISO
      run: |
        set -o pipefail
        make iso 2>&1 | tee make.log
        VERSION=$(grep "OS_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        if [ -z "$VERSION" ]; then
          VERSION="26A150a"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
        nm -n bin/kernel.elf > kernel-symbols.txt
        # Create source archive asset
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD

    - name: Build Diagnostics and Summary
      if: always()
      run: |
        if [ -f make.log ]; then
          echo "=== MAKE.LOG CONSOLE OUTPUT ==="
          cat make.log
          echo "### Build Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 make.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: make-build-log
        path: make.log
        if-no-files-found: ignore

    - name: Upload Debug Kernel Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-kernel
        path: |
          bin/kernel.elf
          kernel-symbols.txt
        if-no-files-found: ignore

    - name: Create P5 Storage Fixtures
      run: bash scripts/create_p5_storage_fixtures.sh .p5-images

    - name: Create P6 Existing-Partition Fixture
      run: bash scripts/create_p6_install_fixture.sh .p6-images

    - name: QEMU UEFI and Legacy Smoke Test
      if: success()
      env:
        QEMU_MODES: ${{ github.event.inputs.qemu_modes || 'all' }}
      run: |
        bash scripts/qemu_smoke_test.sh "pixel-neko-os_${VERSION}.iso"

    - name: Upload QEMU Serial Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qemu-serial-logs
        path: |
          qemu-*-serial.log
          qemu-*-console.log
          qemu-*-screen.ppm
          qemu-p6-install-*.ppm
          qemu-p6-disk-head.bin
          qemu-p6-mbr-disk-head.bin
          qemu-p6-fat16-disk-head.bin
        if-no-files-found: ignore

    - name: Upload Bootable ISO Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-os-iso
        path: pixel-neko-os*.iso
        if-no-files-found: error

    - name: Publish GitHub Pre-release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)"
        body: |
          ## Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)

          > **Pre-release**: P6 complete classic desktop and offline installer. The ISO supports Live and Graphical Installer modes, formats an existing FAT16/FAT32 partition, deploys the full payload and boots independently through Limine UEFI or BIOS.

          ### 📦 Release Assets
          - **Bootable Dual-Boot Hybrid ISO**: `pixel-neko-os_${{ env.VERSION }}.iso`
          - **Source Code Archive**: `pixel_neko_source_${{ env.VERSION }}.zip`
          - **Commit**: `${{ github.sha }}`

          ### 🚀 Running the ISO
          #### 1. UEFI Mode (Recommended for modern hardware)
          ```bash
          qemu-system-x86_64 -bios /usr/share/ovmf/OVMF.fd -cdrom pixel-neko-os_${{ env.VERSION }}.iso -m 512M -serial stdio
          ```
          #### 2. Legacy BIOS Mode (El Torito Hybrid MBR)
          ```bash
          qemu-system-x86_64 -cdrom pixel-neko-os_${{ env.VERSION }}.iso -m 512M -serial stdio -boot d
          ```
          #### 3. VMware / VirtualBox
          Create a 64-bit Other/Linux (x86_64) VM and mount the ISO to boot in either UEFI or Legacy BIOS mode.

          ### P6 Desktop and Installer Highlights
          - **Classic desktop**: menu bar, Neko branding, wallpaper, 3D window chrome, splash animation, cursor and all nine built-in applications.
          - **Boot modes**: Live Desktop, Graphical Installer, Safe Graphics Live and Safe Graphics Installer.
          - **Safe install target**: existing AHCI/IDE GPT or MBR partitions only; no automatic repartitioning.
          - **Filesystem flow**: FAT32 by default, FAT16 for compatible small targets, then recursive payload release and read-back verification.
          - **Offline boot**: UEFI `EFI/BOOT/BOOTX64.EFI` plus native Limine BIOS Stage 1/Stage 2 embedding for GPT and MBR disks.
          - **Acceptance**: CI installs into separate GPT and MBR disks, removes the ISO, then verifies UEFI GPT, BIOS GPT and BIOS MBR standalone boots.

          ### P4b Architecture Highlights
          - **USB 1.1**: UHCI I/O-port frame scheduling and OHCI HCCA/ED/TD control and interrupt transfers.
          - **USB 2.0**: EHCI asynchronous/periodic queues, BIOS ownership handoff, port ownership and asynchronous-advance teardown.
          - **USB 3.0**: Native xHCI command/event/transfer rings, DCBAA, Slot/Endpoint Contexts and interrupt endpoints.
          - **Hub & HID**: Hub power/debounce/reset/recovery, downstream enumeration, Boot and generic Report Protocol keyboard/mouse parsing, Report IDs, wheels and absolute pointer handling.
          - **Hotplug & Recovery**: Runtime attach/detach, unified input delivery, controller-specific device teardown and PS/2 fallback.
          - **Hardware Compatibility**: PIT-calibrated USB delays, BIOS ownership hand-off, EHCI/OHCI short-packet accounting and exact physical DMA addresses.
          - **Boot Paths**: Legacy UHCI and SuperSpeed xHCI USB-storage boot, UEFI/BIOS optical boot, generic non-Boot HID, hub/hotplug and framebuffer screenshot validation.
          - **Runtime Self-test**: QEMU validates eight hardware-oriented scenarios on every release.
          - **Permissive Licensing**: 100% MIT / BSD-2-Clause / CC0 clean code.

          ### P5 Storage Highlights
          - **Block Devices**: 64-bit block abstraction for AHCI SATA, Legacy IDE/ATAPI and USB Bulk-Only Transport.
          - **Partitions**: MBR primary/logical and GPT entry parsing.
          - **Filesystems**: FAT12/16/32 with long names, native exFAT with bitmap/up-case metadata parsing, and ISO9660/Joliet.
          - **Formatting**: FAT16 and FAT32 VBR/BPB, dual FAT initialization, FSInfo and root-cluster formatting.
          - **Drive Mapping**: A:/B: floppy, C: local FAT system partition, D: installation optical media and E: removable exFAT.
          - **Runtime Self-test**: Validated FAT/exFAT reads and writes, FAT16/FAT32 format operations, AHCI ATAPI and xHCI USB storage.
        draft: false
        prerelease: true
        make_latest: false
        files: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel_neko_source_*.zip
