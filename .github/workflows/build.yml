name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y gcc nasm python3 xorriso mtools dosfstools dos2unix zip

    - name: Ensure Unix line endings and script permissions
      run: |
        dos2unix Makefile boot/limine.conf boot/limine-installed.conf scripts/*.sh scripts/*.py sdk/ddk/pdv_driver.mk sdk/pxe_app.mk sdk/crt/*.ld sdk/crt/*.asm sdk/tools/*.py drivers/pdv/*/*.pdi sdk/examples/*/*.pxi sdk/examples/*/Makefile apps/*/*.pxi apps/*/Makefile || \
          sed -i 's/\r$//' Makefile boot/limine.conf boot/limine-installed.conf scripts/*.sh scripts/*.py sdk/ddk/pdv_driver.mk sdk/pxe_app.mk sdk/crt/*.ld sdk/crt/*.asm sdk/tools/*.py drivers/pdv/*/*.pdi sdk/examples/*/*.pxi sdk/examples/*/Makefile apps/*/*.pxi apps/*/Makefile
        chmod +x scripts/*.sh scripts/*.py sdk/tools/*.py

    - name: Build Kernel and Hybrid ISO
      run: |
        set -o pipefail
        make iso 2>&1 | tee make.log
        VERSION=$(grep "OS_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        if [ -z "$VERSION" ]; then
          VERSION="26A225d"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
        nm -n bin/kernel.elf > kernel-symbols.txt
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD
        sha256sum "pixel-neko-os_${VERSION}.iso" > "pixel-neko-os_${VERSION}.iso.sha256"

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: make-build-log
        path: make.log
        if-no-files-found: ignore

    - name: Upload Bootable ISO Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-os-iso
        path: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
        if-no-files-found: error

    - name: Upload Source and Debug Symbols Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-source-and-symbols
        path: |
          pixel_neko_source_${{ env.VERSION }}.zip
          kernel-symbols.txt
        if-no-files-found: error

    - name: Publish GitHub Pre-release
      if: >-
        success() && github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master' ||
         github.ref == 'refs/heads/beta')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        target_commitish: ${{ github.sha }}
        name: "Pixel Neko OS ${{ env.TAG_NAME }} (PXE Executable & SDK Runtime)"
        body: |
          ## Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)

          > **Pre-release (Beta Phase 2)**: Dual-Ring Native `*.pxe` Executable Architecture, Window Compositor & SDK (`sdk/`).

          ### Native PXE Architecture (`*.pxe`)
          - Standardized `PXE\x01` container format (`pxe_format.h`), `.pxi` application manifests, IEEE 802.3 CRC32 verification, 16x16 icon resources, and `sdk/tools/mkpxe.py` packager.
          - Dual-Ring ELF64 PIE loader (`kernel/process/pxe.c`):
            - **Ring 3 (`PXE_RING_3`)**: W^X per-process page tables, dynamic heap (`sbrk`), `SYSCALL`/`IRET` runtime, and Mac System Bomb crash isolation dialog (`wm_notify_app_crash`).
            - **Ring 0 (`PXE_RING_0`)**: High-half PIE slot loading (`0xFFFFFFFFC0000000`–`0xFFFFFFFFEFFFFFFF`), `g_pxe_ring0_api` dispatch table, and untrusted Ring 0 desktop confirmation prompt.
          - Dynamic Window Compositor (`wm/wm.c`) supporting up to 32 PXE canvases (`PAL8` / `RGB32`), live resizing, top menu bar integration, and File Manager double-click `.pxe` launching.
          - Native SDK (`sdk/pxe_app.mk`, `sdk/crt/`, `sdk/libpxe/`, `sdk/include/pxe/`) with example apps packaged under `DEMO/`:
            - `APPS\taskmgr.pxe` (System Task Manager, Ring 0, global `Ctrl+Shift+Esc` & menu bar)
            - `DEMO\hello.pxe` (Ring 3 GUI demo + crash recovery test)
          - Provisioned `APPS\` and `DEMO\` directories in Live CD and offline installer payload (`iso_root/payload/`).

          ### Release Assets
          - **Bootable hybrid ISO**: `pixel-neko-os_${{ env.VERSION }}.iso`
          - **ISO SHA-256**: `pixel-neko-os_${{ env.VERSION }}.iso.sha256`
          - **Source archive**: `pixel_neko_source_${{ env.VERSION }}.zip`
          - **Commit**: `${{ github.sha }}`

          This revision implements VMware SVGA 3D Guest-Backed STDU (OTables, MOB page tables, GB surfaces/screen targets, SVGA_REG_TRACES=0, and FIFO BUSY wakeup) to fix black screens at resolutions above 1152x864 under 3D profiles, and fixes ES1371/CT4810 initial DMA playback silence and AC'97 codec poll stalls as `v26A225d`.
        draft: false
        prerelease: true
        make_latest: false
        files: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
          pixel_neko_source_${{ env.VERSION }}.zip
