name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y gcc nasm python3 xorriso mtools dosfstools qemu-system-x86 dos2unix zip

    - name: Ensure Unix line endings and script permissions
      run: |
        dos2unix Makefile boot/limine.conf boot/limine-installed.conf scripts/*.sh scripts/*.py sdk/ddk/pdv_driver.mk drivers/pdv/*/*.pdi || \
          sed -i 's/\r$//' Makefile boot/limine.conf boot/limine-installed.conf scripts/*.sh scripts/*.py sdk/ddk/pdv_driver.mk drivers/pdv/*/*.pdi
        chmod +x scripts/*.sh scripts/*.py

    - name: Build Kernel and Hybrid ISO
      run: |
        set -o pipefail
        make iso 2>&1 | tee make.log
        VERSION=$(grep "OS_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        if [ -z "$VERSION" ]; then
          VERSION="26A200a"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
        nm -n bin/kernel.elf > kernel-symbols.txt
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD
        sha256sum "pixel-neko-os_${VERSION}.iso" > "pixel-neko-os_${VERSION}.iso.sha256"

    - name: Validate ISA DMA and Floppy Controller
      if: success()
      run: |
        bash scripts/qemu_floppy_test.sh "pixel-neko-os_${VERSION}.iso"

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: make-build-log
        path: make.log
        if-no-files-found: ignore

    - name: Upload Bootable ISO Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-os-iso
        path: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
        if-no-files-found: error

    - name: Upload Source and Debug Symbols Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-source-and-symbols
        path: |
          pixel_neko_source_${{ env.VERSION }}.zip
          kernel-symbols.txt
        if-no-files-found: error

    - name: Publish GitHub Pre-release
      if: >-
        success() && github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master' ||
         github.ref == 'refs/heads/beta')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        target_commitish: ${{ github.sha }}
        name: "Pixel Neko OS ${{ env.TAG_NAME }} (Native PDV Drivers)"
        body: |
          ## Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)

          > **Pre-release (Beta Phase 1)**: Native self-contained loadable driver architecture (`PDEVICE\*.pdv`).

          ### Loadable PDV Driver Architecture (`*.pdv`)
          - Added native `*.pdv` driver container format (`PDV1`), build-time `.pdi` hardware matching manifests, `scripts/mkpdv.py` packager, and standalone DDK (`sdk/ddk/`).
          - Added kernel ELF64 `ET_REL` module loader with strict W^X high-half virtual memory protection (`0xFFFFFFFF90000000`–`0xFFFFFFFFBFFFFFFF`), CRC32 validation, and `pdv_kernel_api_t` DDI table.
          - Automatic hardware enumeration and driver loading from `<CD>:\PDEVICE\*.pdv` in Live/Installer mode and `<SYS>:\PDEVICE\*.pdv` on local installed systems (with `nopdv=1` Safe Mode bypass).
          - Migrated 8 display, audio, and legacy storage drivers out of `kernel.elf` into `PDEVICE\`:
            - Display: `vmwgfx.pdv`, `mach64.pdv`, `nvg7x.pdv`
            - Audio: `hdaudio.pdv`, `ac97.pdv`, `ct4810.pdv`, `cmi8738.pdv`
            - Storage: `fdc.pdv`
          - USB controllers/classes and core boot storage remain built into `kernel.elf`.

          ### Release Assets
          - **Bootable hybrid ISO**: `pixel-neko-os_${{ env.VERSION }}.iso`
          - **ISO SHA-256**: `pixel-neko-os_${{ env.VERSION }}.iso.sha256`
          - **Source archive**: `pixel_neko_source_${{ env.VERSION }}.zip`
          - **Commit**: `${{ github.sha }}`

          This revision publishes Phase 1 of the modular driver architecture on `beta` as `v26A200a`.
        prerelease: true
        make_latest: false
        files: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
          pixel_neko_source_${{ env.VERSION }}.zip
