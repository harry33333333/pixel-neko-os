name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y gcc nasm xorriso mtools dos2unix zip qemu-system-x86 ovmf

    - name: Ensure Unix line endings and script permissions
      run: |
        dos2unix Makefile boot/limine.conf scripts/*.sh || sed -i 's/\r$//' Makefile boot/limine.conf scripts/*.sh
        chmod +x scripts/*.sh

    - name: Build Kernel and Hybrid ISO
      run: |
        set -o pipefail
        make iso 2>&1 | tee make.log
        VERSION=$(grep "OS_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        if [ -z "$VERSION" ]; then
          VERSION="26A118a"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
        nm -n bin/kernel.elf > kernel-symbols.txt
        # Create source archive asset
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD

    - name: Build Diagnostics and Summary
      if: always()
      run: |
        if [ -f make.log ]; then
          echo "=== MAKE.LOG CONSOLE OUTPUT ==="
          cat make.log
          echo "### Build Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 make.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: make-build-log
        path: make.log
        if-no-files-found: ignore

    - name: Upload Debug Kernel Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-kernel
        path: |
          bin/kernel.elf
          kernel-symbols.txt
        if-no-files-found: ignore

    - name: QEMU UEFI and Legacy Smoke Test
      if: success()
      run: |
        bash scripts/qemu_smoke_test.sh "pixel-neko-os_${VERSION}.iso"

    - name: Upload QEMU Serial Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qemu-serial-logs
        path: |
          qemu-*-serial.log
          qemu-*-console.log
        if-no-files-found: ignore

    - name: Upload Bootable ISO Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-os-iso
        path: pixel-neko-os*.iso
        if-no-files-found: error

    - name: Publish GitHub Pre-release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)"
        body: |
          ## Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)

          > **Pre-release**: Unified bus/device/driver tree, PCIe ECAM, safe 64-bit BAR probing and PS/2 input (Milestone P4a Complete).

          ### 📦 Release Assets
          - **Bootable Dual-Boot Hybrid ISO**: `pixel-neko-os_${{ env.VERSION }}.iso`
          - **Source Code Archive**: `pixel_neko_source_${{ env.VERSION }}.zip`
          - **Commit**: `${{ github.sha }}`

          ### 🚀 Running the ISO
          #### 1. UEFI Mode (Recommended for modern hardware)
          ```bash
          qemu-system-x86_64 -bios /usr/share/ovmf/OVMF.fd -cdrom pixel-neko-os_${{ env.VERSION }}.iso -m 512M -serial stdio
          ```
          #### 2. Legacy BIOS Mode (El Torito Hybrid MBR)
          ```bash
          qemu-system-x86_64 -cdrom pixel-neko-os_${{ env.VERSION }}.iso -m 512M -serial stdio -boot d
          ```
          #### 3. VMware / VirtualBox
          Create a 64-bit Other/Linux (x86_64) VM and mount the ISO to boot in either UEFI or Legacy BIOS mode.

          ### P4a Architecture Highlights
          - **P4a.1 Unified Device Model**: Bus/device/driver tree with physical I/O, memory and IRQ reservations plus overlap rejection.
          - **P4a.2 PCI/PCIe**: MCFG range validation, PCIe ECAM mapping, CF8/CFC fallback and complete function enumeration.
          - **Safe 64-bit BAR Discovery**: Device decoding is disabled while BAR masks are probed and original COMMAND/BAR values are restored.
          - **P4a.3 Unified Input**: Interrupt-driven PS/2 keyboard and mouse drivers feed a shared event queue with KEY/MOUSE event types.
          - **Runtime Self-test**: Q35/OVMF verifies ECAM and Legacy BIOS verifies CF8/CFC; QMP injects real PS/2 keyboard and mouse input.
          - **Permissive Licensing**: 100% MIT / BSD-2-Clause / CC0 clean code.
        draft: false
        prerelease: true
        make_latest: false
        files: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel_neko_source_*.zip
