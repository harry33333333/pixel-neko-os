name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y gcc nasm xorriso mtools dos2unix zip

    - name: Ensure Unix line endings and script permissions
      run: |
        dos2unix Makefile boot/limine.conf scripts/*.sh || sed -i 's/\r$//' Makefile boot/limine.conf scripts/*.sh
        chmod +x scripts/*.sh

    - name: Build Kernel and Hybrid ISO
      run: |
        set -o pipefail
        make iso 2>&1 | tee make.log
        VERSION=$(grep "OS_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        if [ -z "$VERSION" ]; then
          VERSION="26A181d"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
        nm -n bin/kernel.elf > kernel-symbols.txt
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD
        sha256sum "pixel-neko-os_${VERSION}.iso" > "pixel-neko-os_${VERSION}.iso.sha256"

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: make-build-log
        path: make.log
        if-no-files-found: ignore

    - name: Upload Bootable ISO Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-os-iso
        path: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
        if-no-files-found: error

    - name: Upload Source and Debug Symbols Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-source-and-symbols
        path: |
          pixel_neko_source_${{ env.VERSION }}.zip
          kernel-symbols.txt
        if-no-files-found: error

    - name: Publish GitHub Pre-release
      if: >-
        success() && github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        target_commitish: ${{ github.sha }}
        name: "Pixel Neko OS ${{ env.TAG_NAME }} (Boot Menu Cleanup)"
        body: |
          ## Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)

          > **Pre-release**: simplified boot menus with automatic high-resolution selection.

          ### Display compatibility
          - Live, installer and installed-system boots request 1280x1024x16 and fall back automatically when the firmware or video memory cannot provide it.
          - 1280x1024 is exposed in the desktop settings only when the active framebuffer and display backend support the real scanout.
          - ATI detection disables acceleration and mode switching, while enforcing a maximum of 1024x768x16.
          - Logical and physical resolutions must match before a high-resolution mode is accepted, preventing black screens and shrunken fonts.

          ### Boot menu
          - The ISO keeps Live Desktop and Graphical Installer as the primary entries.
          - Duplicate installer diagnostics, manual NVIDIA high-resolution entries and verbose/debug entries were removed.
          - Advanced Boot Options now contains only the Safe Graphics recovery path.
          - Installed systems use the same automatic resolution policy with a single Safe Graphics recovery path.

          ### Release Assets
          - **Bootable hybrid ISO**: `pixel-neko-os_${{ env.VERSION }}.iso`
          - **ISO SHA-256**: `pixel-neko-os_${{ env.VERSION }}.iso.sha256`
          - **Source archive**: `pixel_neko_source_${{ env.VERSION }}.zip`
          - **Commit**: `${{ github.sha }}`

          This revision replaces the existing `v26A181d` pre-release assets without changing the version number.
        prerelease: true
        make_latest: false
        files: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
          pixel_neko_source_${{ env.VERSION }}.zip
