name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y gcc nasm xorriso mtools dos2unix zip qemu-system-x86 ovmf

    - name: Ensure Unix line endings and script permissions
      run: |
        dos2unix Makefile boot/limine.conf scripts/*.sh || sed -i 's/\r$//' Makefile boot/limine.conf scripts/*.sh
        chmod +x scripts/*.sh

    - name: Build Kernel and Hybrid ISO
      run: |
        set -o pipefail
        make iso 2>&1 | tee make.log
        VERSION=$(grep "OS_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        if [ -z "$VERSION" ]; then
          VERSION="26A115a"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
        nm -n bin/kernel.elf > kernel-symbols.txt
        # Create source archive asset
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD

    - name: Build Diagnostics and Summary
      if: always()
      run: |
        if [ -f make.log ]; then
          echo "=== MAKE.LOG CONSOLE OUTPUT ==="
          cat make.log
          echo "### Build Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 make.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: make-build-log
        path: make.log
        if-no-files-found: ignore

    - name: Upload Debug Kernel Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-kernel
        path: |
          bin/kernel.elf
          kernel-symbols.txt
        if-no-files-found: ignore

    - name: QEMU UEFI and Legacy Smoke Test
      if: success()
      run: |
        bash scripts/qemu_smoke_test.sh "pixel-neko-os_${VERSION}.iso"

    - name: Upload QEMU Serial Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qemu-serial-logs
        path: qemu-*-serial.log
        if-no-files-found: ignore

    - name: Upload Bootable ISO Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-os-iso
        path: pixel-neko-os*.iso
        if-no-files-found: error

    - name: Publish GitHub Pre-release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)"
        body: |
          ## Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)

          > **Pre-release**: Ring 3 process runtime, preemptive scheduling, NMI-safe syscalls and IPC (Milestone P3 Complete).

          ### 📦 Release Assets
          - **Bootable Dual-Boot Hybrid ISO**: `pixel-neko-os_${{ env.VERSION }}.iso`
          - **Source Code Archive**: `pixel_neko_source_${{ env.VERSION }}.zip`
          - **Commit**: `${{ github.sha }}`

          ### 🚀 Running the ISO
          #### 1. UEFI Mode (Recommended for modern hardware)
          ```bash
          qemu-system-x86_64 -bios /usr/share/ovmf/OVMF.fd -cdrom pixel-neko-os_${{ env.VERSION }}.iso -m 512M -serial stdio
          ```
          #### 2. Legacy BIOS Mode (El Torito Hybrid MBR)
          ```bash
          qemu-system-x86_64 -cdrom pixel-neko-os_${{ env.VERSION }}.iso -m 512M -serial stdio -boot d
          ```
          #### 3. VMware / VirtualBox
          Create a 64-bit Other/Linux (x86_64) VM and mount the ISO to boot in either UEFI or Legacy BIOS mode.

          ### P3 Architecture Highlights
          - **P3.1 TCB/PCB Scheduler**: Per-thread kernel stacks, idle thread, LAPIC preemptive round-robin scheduling and blocking sleep.
          - **P3.2 FPU/SSE Context**: CR0.MP/NE, CR4.OSFXSR/OSXMMEXCPT and aligned 512-byte FXSAVE/FXRSTOR state per thread.
          - **P3.3 SYSCALL/SYSRET**: FMASK=0x600, System V register ABI, canonical return validation and GS-aware paranoid NMI handling on IST2.
          - **P3.4 Ring 3 ELF Loader**: Validated ELF64 PT_LOAD parsing, RX/RW/NX page permissions, isolated user PML4 and initial argc/argv stack.
          - **P3.5 IPC**: Blocking message queues, wakeup delivery and shared-memory attachment between two independent Ring 3 processes.
          - **Runtime Self-test**: The init and echo ELFs verify FPU state, syscalls, IPC and shared memory on every boot.
          - **Permissive Licensing**: 100% MIT / BSD-2-Clause / CC0 clean code.
        draft: false
        prerelease: true
        make_latest: false
        files: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel_neko_source_*.zip
