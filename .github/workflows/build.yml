name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "master", "beta-v26A180b" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y gcc nasm xorriso mtools dos2unix zip

    - name: Ensure Unix line endings and script permissions
      run: |
        dos2unix Makefile boot/limine.conf scripts/*.sh || sed -i 's/\r$//' Makefile boot/limine.conf scripts/*.sh
        chmod +x scripts/*.sh

    - name: Build Kernel and Hybrid ISO
      run: |
        set -o pipefail
        make iso 2>&1 | tee make.log
        VERSION=$(grep "OS_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        if [ -z "$VERSION" ]; then
          VERSION="26A180b"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
        nm -n bin/kernel.elf > kernel-symbols.txt
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD
        sha256sum "pixel-neko-os_${VERSION}.iso" > "pixel-neko-os_${VERSION}.iso.sha256"

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: make-build-log
        path: make.log
        if-no-files-found: ignore

    - name: Upload Bootable ISO Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-os-iso
        path: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
        if-no-files-found: error

    - name: Upload Source and Debug Symbols Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-source-and-symbols
        path: |
          pixel_neko_source_${{ env.VERSION }}.zip
          kernel-symbols.txt
        if-no-files-found: error

    - name: Publish GitHub Pre-release
      if: >-
        success() && github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master' ||
         github.ref == 'refs/heads/beta-v26A180b')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        target_commitish: ${{ github.sha }}
        name: "Pixel Neko OS ${{ env.TAG_NAME }} (USB 3.x Beta)"
        body: |
          ## Pixel Neko OS ${{ env.TAG_NAME }} (Snow Neko)

          > **Pre-release**: broad USB 3.x host-controller compatibility work.

          ### USB 3.x fixes
          - SuperSpeed and SuperSpeed+ protocol speed IDs are accepted, including 10/20 Gb/s links.
          - xHCI port power, connect debounce, reset completion and warm-reset fallback follow the controller link state instead of fixed emulator timing.
          - USB 3.x Endpoint Companion data supplies MaxBurst and ESIT payload values to endpoint contexts.
          - Larger xHCI slot, root-port and DMA-ring capacity supports multi-hub and multi-device topologies.
          - BIOS ownership handoff is bounded and non-destructive; Intel legacy routing updates only masked routes.
          - Malformed or empty descriptors are rejected instead of being exposed as valid devices.

          ### Release Assets
          - **Bootable hybrid ISO**: `pixel-neko-os_${{ env.VERSION }}.iso`
          - **ISO SHA-256**: `pixel-neko-os_${{ env.VERSION }}.iso.sha256`
          - **Source archive**: `pixel_neko_source_${{ env.VERSION }}.zip`
          - **Commit**: `${{ github.sha }}`

          This revision is published from the beta branch for physical-machine validation and is not merged into `main`.
        prerelease: true
        make_latest: false
        files: |
          pixel-neko-os_${{ env.VERSION }}.iso
          pixel-neko-os_${{ env.VERSION }}.iso.sha256
          pixel_neko_source_${{ env.VERSION }}.zip
