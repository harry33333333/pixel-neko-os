timeout: 5
default_entry: 1
interface_branding: Pixel Neko OS Installed System (Darwin 26A225b)

/Pixel Neko OS 2.0 (Local Installed System)
    protocol: limine
    kaslr: no
    kernel_path: boot():/boot/kernel.elf
    resolution: 800x600x16
    cmdline: console=serial,vga mode=local loglevel=debug

/Advanced Boot Options
    //Safe Graphics Fallback (Local Installed System)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 800x600x32
        cmdline: console=serial,vga mode=local safe_mode=1 loglevel=debug

    //Safe Mode (Skip PDEVICE Drivers)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 800x600x32
        cmdline: console=serial,vga mode=local safe_mode=1 nopdv=1 loglevel=debug
