timeout: 5
default_entry: 1
interface_branding: Pixel Neko OS Boot Manager (Darwin 26A176a)

/Pixel Neko OS 2.0 (Live Desktop Mode)
    protocol: limine
    kaslr: no
    kernel_path: boot():/boot/kernel.elf
    resolution: 1024x768x32
    cmdline: console=serial,vga mode=live loglevel=debug

/Pixel Neko OS 2.0 (Graphical Installer Mode)
    protocol: limine
    kaslr: no
    kernel_path: boot():/boot/kernel.elf
    resolution: 1024x768x32
    cmdline: console=serial,vga mode=install loglevel=debug

/Advanced Boot Options
    //Safe Graphics Fallback (Live Desktop)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 800x600x32
        cmdline: console=serial,vga mode=live safe_mode=1 loglevel=debug

    //Safe Graphics Fallback (Graphical Installer)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 800x600x32
        cmdline: console=serial,vga mode=install safe_mode=1 loglevel=debug

    //Classic Diagnostic Boot (Verbose Step Mode - Live)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 1024x768x32
        cmdline: console=serial,vga mode=live verbose_boot=1 loglevel=debug

    //Classic Diagnostic Boot (Verbose Step Mode - Installer)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 1024x768x32
        cmdline: console=serial,vga mode=install verbose_boot=1 loglevel=debug

    //Debug Serial & Screenshot Boot (Live Desktop)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 1024x768x32
        cmdline: console=serial,vga mode=live debug_log=1 loglevel=debug

    //Debug Serial & Screenshot Boot (Graphical Installer)
        protocol: limine
        kaslr: no
        kernel_path: boot():/boot/kernel.elf
        resolution: 1024x768x32
        cmdline: console=serial,vga mode=install debug_log=1 loglevel=debug
