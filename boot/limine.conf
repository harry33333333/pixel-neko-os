timeout: 3
default_entry: 1
interface_branding: Pixel Neko OS Boot Manager (Darwin 26A1001a)

/Pixel Neko OS 2.0 (Snow Neko)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    resolution: 1024x768x32
    cmdline: console=serial,vga loglevel=debug

/Pixel Neko OS (Safe Graphics Fallback)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    resolution: 800x600x32
    cmdline: console=serial,vga safe_mode=1
